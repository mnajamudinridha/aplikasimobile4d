plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    compileSdk 32

    defaultConfig {
        applicationId "com.example.aplikasimobile4d"
        minSdk 24
        targetSdk 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    // PENTING: versi AndroidX dipatok ke yang kompatibel dengan compileSdk 32 + AGP 7.2.1.
    // appcompat >= 1.5 dan material >= 1.7 (mis. 1.7.1 / 1.14.0) menarik androidx.core:core:1.16
    // yang MEWAJIBKAN compileSdk 34 + AGP 8.6+, sehingga build gagal pada toolchain ini.
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'

    // Firebase via BoM (Bill of Materials): satu sumber versi untuk semua pustaka Firebase,
    // jadi firebase-database tidak perlu ditulis nomor versinya. BoM 32.7.0 teruji dgn AGP 7.2.1.
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-database'

    // RecyclerView untuk menampilkan daftar kontak
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}